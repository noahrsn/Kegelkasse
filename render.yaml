# Render Blueprint — Kegelkasse Frontend (React + Vite, statische SPA)
# Doku: https://render.com/docs/blueprint-spec
#
# Einrichtung (einmalig):
#   1. render.com → "New +" → "Blueprint" → dieses Repo verbinden.
#   2. Render liest diese Datei und legt den Static-Site-Service an.
#   3. Beim Anlegen nach dem Wert für VITE_SUPABASE_ANON_KEY gefragt werden
#      (sync: false) → den anon/publishable Key des Supabase-Projekts eintragen.
#   4. Deploy. Danach baut Render bei jedem Push auf "main" automatisch neu.
#
# Hinweis: VITE_*-Variablen werden zur BUILD-Zeit in das Bundle eingebacken.
# Der ANON-Key ist ein öffentlicher Client-Key (landet ohnehin im JS-Bundle);
# RLS schützt die Daten. Er steht trotzdem als sync:false hier, damit er nicht
# im Repo liegt und unabhängig rotierbar bleibt.

services:
  - type: web
    name: kegelkasse
    runtime: static
    rootDir: prototype
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    # SPA-Routing: alle Pfade auf index.html (zusätzlich zu public/_redirects).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://zezizdnvjpbnhntpzvpt.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
