# nginx-Konfiguration für die statische Pudl-SPA.
# TLS macht Cloudflare (Tunnel "homeserver") — hier reicht plain HTTP auf Port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompression für Text-Assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Sicherheits-Header (Pendant zu prototype/public/_headers, das nginx nicht liest).
    # Ergänzt gegenüber _headers: Google Fonts sind in style-src/font-src erlaubt,
    # sonst blockiert die CSP den <link> auf fonts.googleapis.com aus index.html.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'" always;

    # Gehashte Build-Assets sind unveränderlich → lange cachen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nie cachen, sonst sehen Clients nach einem Deploy altes JS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service Worker ebenfalls nie cachen: sonst bleibt nach einem Deploy ein
    # alter Worker aktiv, obwohl längst ein neuer ausgeliefert wird.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA-Routing: unbekannte Pfade auf index.html (React Router übernimmt).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
