# Supabase CLI Konfiguration — Kegelkasse
# Doku: https://supabase.com/docs/guides/local-development/cli/config

project_id = "kegelkasse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Lokaler Mailserver (Inbucket) — fängt alle Mails im Dev ab.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Toleranzfenster fuer parallele Refreshs (zwei Tabs, Retry nach Netzaussetzer).
# Zu knapp bemessen wertet der Server einen legitimen zweiten Refresh als
# Token-Reuse und entwertet die komplette Session-Familie -> Zwangs-Logout.
refresh_token_reuse_interval = 30
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Edge Functions (Deno/TypeScript)
# Hinweis: CSV-Import läuft client-seitig (lib/csv.js) + RPC import_transactions,
# Awards werden live über RPC group_awards berechnet — daher keine eigenen
# Edge Functions dafür.
[functions.session-approve]
verify_jwt = true

# Geplante Jobs (via pg_cron getriggert) — kein User-JWT.
[functions.monthly-fee]
verify_jwt = false

# Leert die E-Mail-Outbox. Kein JWT (pg_cron hat keins) — die Function prüft
# stattdessen selbst das Shared Secret NOTIFY_CRON_SECRET.
[functions.notify-dispatch]
verify_jwt = false

# Abmelde-Link aus E-Mails: autorisiert wird über den Token in der URL.
[functions.notify-unsubscribe]
verify_jwt = false
