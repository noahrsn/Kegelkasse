name: Supabase Keep-Alive

# Hält das Free-Tier-Supabase-Projekt wach: Supabase pausiert ein Projekt erst
# nach 7 Tagen ohne jeglichen Request. Ein regelmäßiger Ping auf die REST-API
# zählt als Aktivität und setzt den Pause-Timer zurück.

on:
  schedule:
    # Alle 3 Tage um 07:13 UTC. Bewusst nicht zur vollen Stunde, weil
    # GitHub-Cron zu runden Zeiten stärker ausgelastet ist (= mehr Verzögerung).
    # Auf "alle 6 Tage" stellen: */6 statt */3.
    - cron: "13 7 */3 * *"
  workflow_dispatch: {} # manueller Start zum Testen

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL und/oder SUPABASE_ANON_KEY fehlen."
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/")

          echo "HTTP-Status: ${code}"

          # 200 = OK. 401/403 wären zwar "erreicht" (zählt auch als Aktivität),
          # deuten aber auf einen falschen Key hin -> als Fehler behandeln.
          if [ "${code}" != "200" ]; then
            echo "::error::Unerwarteter Status ${code} von der Supabase-REST-API."
            exit 1
          fi

          echo "Supabase-Projekt erfolgreich angepingt."
